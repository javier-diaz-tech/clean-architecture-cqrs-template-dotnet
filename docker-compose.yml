services:
  arquitecturabase:
    # Construye usando el Dockerfile ubicado en la misma raíz (.)
    build:
      context: .
      dockerfile: Presentacion/Dockerfile
    container_name: arquitecturabase.api
    restart: unless-stopped               # Se levanta solo si el servidor Linux se reinicia
    ports:
      - "3000:8080"               # Puerto_Servidor_Linux : Puerto_Contenedor
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Persistence__Provider: SqlServer
      ConnectionStrings__DefaultConnection: ${APP_CONNECTION_STRING}

    # Identificación de la aplicación
      OpenTelemetry__ServiceName: ArquitecturaBase.Api
      OpenTelemetry__EnableConsoleExporter: "true"
      OpenTelemetry__EnableOtlpExporter: "false"
    
    
    
    networks:
      - red_microservicios
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: arquitecturabase.sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - red_microservicios

networks:
  red_microservicios:
    driver: bridge

volumes:
  sqlserver_data:
